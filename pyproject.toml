[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-compass"
version = "0.1.0"
description = "Deterministic, explainable AI model recommendation engine."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["decision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
