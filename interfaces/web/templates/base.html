<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Model Compass{% endblock %}</title>
  <meta name="description" content="An open-source decision engine that helps developers choose the most suitable AI model for their specific use case — with a reason, never just a model name.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Model Compass">
  <meta property="og:title" content="Model Compass">
  <meta property="og:description" content="Developers don't need more information. They need better decisions.">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <script>
    /* Apply the saved theme before first paint to avoid a light flash. */
    try {
      var t = localStorage.getItem("mc-theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/forms.css">
  <link rel="stylesheet" href="/static/decision-form.css">
  <link rel="stylesheet" href="/static/result.css">
  <link rel="stylesheet" href="/static/result-profile.css">
  <link rel="stylesheet" href="/static/reveal.css">
  <link rel="stylesheet" href="/static/compute.css">
  <link rel="stylesheet" href="/static/landing.css">
  <link rel="stylesheet" href="/static/compare.css">
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-header">
    <a class="brand" href="/">Model Compass</a>
    <p class="tagline">Developers don't need more information. They need better decisions.</p>
    <div class="header-actions">
    <a class="header-link" href="/compare">Compare models</a>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch color theme">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="footer-links">
      <ul class="footer-principles">
        <li>Open source</li>
        <li>MIT licensed</li>
        <li>Deterministic</li>
        <li>Explainable</li>
      </ul>
      <nav class="footer-nav">
        <a href="https://github.com/LCAITECH/model-compass" target="_blank" rel="noopener">GitHub</a>
        <a href="https://github.com/LCAITECH/model-compass/tree/main/Docs" target="_blank" rel="noopener">Documentation</a>
      </nav>
    </div>
    <p>Model Compass is a deterministic, explainable AI model recommendation engine.</p>
  </footer>
  <script src="/static/theme.js"></script>
  <script src="/static/form.js"></script>
  <script src="/static/compute.js"></script>
  <script src="/static/hero-net.js"></script>
  <script src="/static/reveal.js"></script>
</body>
</html>
