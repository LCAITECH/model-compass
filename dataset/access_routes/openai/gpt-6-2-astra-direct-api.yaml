  status: confirmed
  caveat: "Ordinary self-serve API access with the standard usage tiers (Build, Launch, Grow). Tool calling requires the Responses API; Chat Completions works without tools. The API rejects requests that set reasoning effort to none. Prompts over 272K input tokens are billed at 2x input and cache rates and 1.5x output for the whole request. Batch is 50% of Standard, Fast is 2x, and Ultrafast is 3x Standard through February 28, 2027 then 6x from March 1, 2027 (Pacific time). Background completion windows in the Responses API public beta are 30% below Standard for a two-hour window and 40% below for an eight-hour window. API usage is billed separately from ChatGPT and needs its own payment method under API billing."
