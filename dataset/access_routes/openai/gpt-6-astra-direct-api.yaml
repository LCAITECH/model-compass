  caveat: "As of 2026-09-04, this route required Trusted Access Program membership (RequirementKind.PROGRAM_MEMBERSHIP) -- OpenAI's own model page stated the Plus/Pro/Business/Enterprise rollout was 'coming in the coming days.' Re-verified 2026-09-07 against the pricing page, this model's own page, and the models index: the Trusted Access Program rollout paragraph is gone from all three, GPT-6 Astra is now presented as the default flagship model with no access caveat, and its rate-limits table lists standard usage tiers (Tier 1-5) identical in shape to every other self-serve model -- no program-membership tier listed anywhere. Treated as ordinary self-serve API access now, same requirement as gpt-5-6-sol's own direct-api route. API service is billed and managed separately from ChatGPT -- requires its own payment method under API billing."
