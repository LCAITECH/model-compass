id: mistral-large-3
name: Mistral Large 3
provider: Mistral AI
version: "3"
license: open-weights

capabilities:
  vision: true
  audio: false
  image_generation: false
  tool_calling: true
  structured_output: true
  json_mode: true

quality:
  reasoning: high
  coding: high
  creative_writing: medium
  instruction_following: high

languages: [en, es, pt, fr, de, it, nl, zh, ja, ko, ar]
language_quality:
  en: very_high
  es: high
  pt: high
  fr: very_high
  de: high
  it: high
  nl: medium
  zh: medium
  ja: medium
  ko: medium
  ar: medium

# Model card: context "256k" (262,144 tokens); no output ceiling published, so
# max_output is null (Iteration #26) instead of a copy of the context window.
# Source: https://docs.mistral.ai/models/mistral-large-3-25-12 (checked 2026-10-15).
operational:
  context_window: 262144
  max_output: null

cost:
  input_per_million: 0.50
  output_per_million: 1.50

ecosystem:
  integration_ease: medium
  maturity: stable

access:
  has_free_access: false

# Source: https://docs.mistral.ai/getting-started/models/models_overview/
# ("Deprecated & retired models": Mistral Large 3, mistral-large-2512,
# deprecation 10/31/2026, retirement 4/30/2027, alternative Mistral Large 4)
# and the model card https://docs.mistral.ai/models/mistral-large-3-25-12:
# "This model is deprecated. Use Mistral Large 4 for new integrations."
# Mistral's lifecycle policy (https://docs.mistral.ai/inference/model-lifecycle)
# defines Deprecated as "Retirement announced. Still accessible until the
# retirement date." (checked 2026-11-04). On 2026-10-14 the overview still
# listed it among the generalist models.
# The deprecated status was recorded on 2026-11-06 from the model card alone
# (Iteration #41, no retirement date, replacement null while Large 4 was not in
# the dataset); the retirement date and the replacement came with the admission
# of mistral-large-4 (Iteration #45).
# Release date: https://docs.mistral.ai/models/mistral-large-3-25-12 (model card date).
lifecycle:
  status: deprecated
  release_date: "2025-12-02"
  shutdown_date: "2027-04-30"
  replacement: mistral-large-4
