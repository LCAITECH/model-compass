id: gpt-6-2-astra
name: GPT-6.2 Astra
provider: OpenAI
version: "6.2"
license: proprietary

capabilities:
  vision: true
  audio: false
  image_generation: false
  tool_calling: true
  structured_output: true
  json_mode: true

quality:
  reasoning: very_high
  coding: very_high
  creative_writing: high
  instruction_following: very_high

languages: [en, es, pt, fr, de, ja, zh, hi, ar, ru]
language_quality:
  en: very_high
  es: high
  pt: high
  fr: high
  de: high
  ja: medium
  zh: medium
  hi: medium
  ar: medium
  ru: medium

operational:
  context_window: 1050000
  max_output: 128000

# Standard short-context Flagship pricing. Source (direct):
# https://developers.openai.com/api/docs/pricing and
# https://developers.openai.com/api/docs/models/gpt-6.2-astra
# Prompts over 272K input tokens: 2x input and cache rates, 1.5x output
# for the whole request ($16.00 / $60.00 on the pricing page); that higher
# tier is not stored (Iteration #24). Cached input $0.40; cache writes
# $10.00 (30-minute retention) or $20.00 (12-hour). Batch is 50% of
# Standard, Fast is 2x, Ultrafast is 3x Standard through 2027-02-28 then
# 6x from 2027-03-01 (Pacific). Background completion windows in the
# Responses API public beta are 30% below Standard (2-hour) and 40% below
# (8-hour). None of these has a schema field.
cost:
  input_per_million: 8.00
  output_per_million: 40.00

ecosystem:
  integration_ease: high
  maturity: stable

# No free path: the model page lists only paid usage tiers (Build/Launch/Grow),
# and OpenAI's announcement names Plus, Pro, Enterprise and Edu in ChatGPT Work
# and Codex, not Free.
# Source: https://openai.com/index/introducing-gpt-6-2-astra-sol/ (read 2026-11-18).
access:
  has_free_access: false

# Source: https://developers.openai.com/api/docs/deprecations (checked 2026-11-18).
# Not on the deprecations page.
# Release date: https://developers.openai.com/api/docs/changelog (Nov 17, 2026:
# "Use GPT-6.2 Astra for demanding reasoning and coding tasks...").
lifecycle:
  status: active
  release_date: "2026-11-17"
  shutdown_date: null
  replacement: null
