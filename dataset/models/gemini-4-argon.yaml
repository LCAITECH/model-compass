id: gemini-4-argon
name: Gemini 4 Argon
provider: Google
version: "4"
license: proprietary

capabilities:
  vision: true
  audio: true
  image_generation: false
  tool_calling: true
  structured_output: true
  json_mode: true

quality:
  reasoning: very_high
  coding: very_high
  creative_writing: medium
  instruction_following: high

languages: [en, es, pt, fr, de, ja, zh, hi, ar, ru]
language_quality:
  en: very_high
  es: high
  pt: high
  fr: high
  de: high
  ja: medium
  zh: medium
  hi: medium
  ar: medium
  ru: medium

# max_output is the default synchronous limit. The model page also documents
# "up to 1,048,576 (with long decode)" -- recorded in Docs/models/gemini-4-argon.md
# (same convention as a second price tier, Iteration #24/#26).
operational:
  context_window: 1048576
  max_output: 65536

# Introductory price, through 2026-11-30; $4.00/$20.00 from 2026-12-01.
# Source: https://ai.google.dev/gemini-api/docs/pricing (Paid Tier, Standard).
cost:
  input_per_million: 2.00
  output_per_million: 10.00
  effective_until: "2026-11-30"
  reverts_to:
    input_per_million: 4.00
    output_per_million: 20.00

ecosystem:
  integration_ease: high
  maturity: stable

access:
  has_free_access: false
