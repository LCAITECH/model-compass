id: gemini-2.5-flash
name: Gemini 2.5 Flash
provider: Google
version: "2.5"
license: proprietary

capabilities:
  vision: true
  audio: true
  image_generation: false
  tool_calling: true
  structured_output: true
  json_mode: true

quality:
  reasoning: high
  coding: high
  creative_writing: medium
  instruction_following: high

languages: [en, es, pt, fr, de, ja, zh, hi, ar, ru]
language_quality:
  en: very_high
  es: high
  pt: high
  fr: high
  de: high
  ja: medium
  zh: medium
  hi: medium
  ar: medium
  ru: medium

operational:
  context_window: 1048576
  max_output: 65536

cost:
  input_per_million: 0.30
  output_per_million: 2.50

ecosystem:
  integration_ease: high
  maturity: stable

access:
  has_free_access: true

# Source: https://ai.google.dev/gemini-api/docs/deprecations (checked 2026-11-06).
# Deprecated. No longer selectable in Google AI Studio. Effective 2026-12-01,
# API requests route to gemini-3.5-flash-lite and are billed at that model's
# rates. The shutdown-date column is 2026-12-01; the recommended replacement
# is gemini-3.5-flash-lite. Access remains limited to developers who already
# used it. Replaces the 2026-10-15 `restricted` status and the owner's
# stand-in successor gemini-3.8-flash (Iteration #29), which Google had not
# named per model.
# Release date: https://ai.google.dev/gemini-api/docs/deprecations (release date column).
lifecycle:
  status: deprecated
  release_date: "2025-06-17"
  shutdown_date: "2026-12-01"
  replacement: gemini-3.5-flash-lite
