id: gemini-2.5-flash
name: Gemini 2.5 Flash
provider: Google
version: "2.5"
license: proprietary

capabilities:
  vision: true
  audio: true
  image_generation: false
  tool_calling: true
  structured_output: true
  json_mode: true

quality:
  reasoning: high
  coding: high
  creative_writing: medium
  instruction_following: high

languages: [en, es, pt, fr, de, ja, zh, hi, ar, ru]
language_quality:
  en: very_high
  es: high
  pt: high
  fr: high
  de: high
  ja: medium
  zh: medium
  hi: medium
  ar: medium
  ru: medium

operational:
  context_window: 1048576
  max_output: 65536

cost:
  input_per_million: 0.30
  output_per_million: 2.50

ecosystem:
  integration_ease: high
  maturity: stable

access:
  has_free_access: true

# Source: https://aistudio.google.com/docs/deprecations (formerly
# ai.google.dev/gemini-api/docs/deprecations, which now redirects; checked 2026-11-03).
# Google release notes, November 2, 2026 (https://aistudio.google.com/docs/changelog):
# "gemini-2.5-flash is deprecated and is no longer available to select in Google
# AI Studio. Effective December 1, 2026, all API requests to gemini-2.5-flash will
# automatically route to gemini-3.5-flash-lite and be billed at Gemini 3.5
# Flash-Lite rates."
# Deprecations table: shutdown date "December 1, 2026"; recommended
# replacement "gemini-3.5-flash-lite".
# Replacement: gemini-3.5-flash-lite, the successor Google names in the
# deprecations table and the release note. Owner decision of 2026-11-03 to
# follow Google (was gemini-3.8-flash, the owner's pick under Iteration #29).
# Release date: https://aistudio.google.com/docs/deprecations (release date column).
lifecycle:
  status: deprecated
  release_date: "2025-06-17"
  shutdown_date: "2026-12-01"
  replacement: gemini-3.5-flash-lite
