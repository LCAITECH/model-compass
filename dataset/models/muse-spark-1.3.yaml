id: muse-spark-1.3
name: Muse Spark 1.3
provider: Meta
version: "1.3"
license: proprietary

# Models page: text, image, video, audio and PDF input, text output, but
# "Audio understanding in Muse Spark 1.3 is currently not fully supported"
# (Meta points audio work to Muse Spark 1.2), so audio is false here; Meta's
# own agent config lists input ["text", "image", "pdf", "video"]. json_mode:
# JSON Schema structured output only, same basis as other entries.
# Sources: https://dev.meta.ai/docs/models, https://dev.meta.ai/docs/coding-agents (checked 2026-10-15).
capabilities:
  vision: true
  audio: false
  image_generation: false
  tool_calling: true
  structured_output: true
  json_mode: true

quality:
  reasoning: high
  coding: high
  creative_writing: medium
  instruction_following: high

# Meta publishes no supported-language list; curated (Iteration #33).
languages: [en, es, pt, fr, de, it]
language_quality:
  en: very_high
  es: high
  pt: high
  fr: high
  de: high
  it: high

# Context: "a 1,048,576-token context window" (models page). Output: Meta's
# quickstart and coding-agents guide give "Limits: context 1048576, output
# 131072" for muse-spark-1.3 (Iteration #33).
operational:
  context_window: 1048576
  max_output: 131072

# Standard mode. Contributor mode (muse-spark-1.3-contributor, $0.10/$0.20)
# lets Meta train on your content; see Docs/models/muse-spark-1.3.md.
# Source: https://dev.meta.ai/docs/pricing-rate-limits (checked 2026-10-15).
cost:
  input_per_million: 1.25
  output_per_million: 4.25

ecosystem:
  integration_ease: high
  maturity: stable

access:
  has_free_access: false

# Source: https://dev.meta.ai/docs/models (checked 2026-10-15): "the latest
# version ... Recommended for new work", no deprecation. Release date:
# https://research.meta.ai/blog/introducing-muse-spark-1-3 (September 2, 2026,
# "now available on Muse Code and Meta Model API").
lifecycle:
  status: active
  release_date: "2026-09-02"
  shutdown_date: null
  replacement: null
