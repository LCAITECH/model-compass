id: claude-haiku-5-5
name: Claude Haiku 5.5
provider: Anthropic
version: "5.5"
license: proprietary

capabilities:
  vision: true
  audio: false
  image_generation: false
  tool_calling: true
  structured_output: true
  json_mode: true

quality:
  reasoning: high
  coding: high
  creative_writing: medium
  instruction_following: high

languages: [en, es, pt, fr, de, ja, zh, hi, ar, ru]
language_quality:
  en: very_high
  es: very_high
  pt: high
  fr: high
  de: high
  ja: high
  zh: high
  hi: medium
  ar: medium
  ru: medium

operational:
  context_window: 1000000
  max_output: 128000

# Two-tier pricing by prompt length; the schema stores one rate, so this is
# the tier for prompts up to 100,000 tokens. Prompts over 100,000 tokens are
# billed $0.50 input / $2.50 output (see Docs/models/claude-haiku-5-5.md).
# Source: https://platform.claude.com/docs/en/about-claude/pricing
cost:
  input_per_million: 0.10
  output_per_million: 0.50

ecosystem:
  integration_ease: high
  maturity: stable

# Free consumer plan, not the API (Iteration #32): "Free, Pro, Max, Team, and
# Enterprise users can select Haiku 5.5 on Claude.ai". The API has only a
# one-time starter credit. Source: https://www.anthropic.com/claude/haiku (checked 2026-10-15).
access:
  has_free_access: true

# Source: https://platform.claude.com/docs/en/about-claude/model-deprecations (checked 2026-10-14).
# Release date: https://platform.claude.com/docs/en/models/haiku-5-5/overview ("Released").
lifecycle:
  status: active
  release_date: "2026-10-07"
  shutdown_date: null
  replacement: null
