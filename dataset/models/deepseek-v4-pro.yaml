id: deepseek-v4-pro
name: DeepSeek V4 Pro
provider: DeepSeek
version: "V4"
license: open-weights

capabilities:
  vision: false
  audio: false
  image_generation: false
  tool_calling: true
  structured_output: false
  json_mode: true

quality:
  reasoning: very_high
  coding: very_high
  creative_writing: medium
  instruction_following: high

languages: [en, zh, es, fr, de, ja, ru]
language_quality:
  en: very_high
  zh: very_high
  es: high
  fr: high
  de: high
  ja: high
  ru: high

operational:
  context_window: 1000000
  max_output: 384000

# Peak-hours rate (01:00-04:00 and 06:00-10:00 UTC, Mon-Fri) per
# DeepSeek's official pricing page — the stale $0.435/$0.87 previously
# here matched neither current tier. Off-peak (all other hours) is
# half this: $0.66/$1.98. Source: https://api-docs.deepseek.com/quick_start/pricing
cost:
  input_per_million: 1.32
  output_per_million: 3.96

ecosystem:
  integration_ease: medium
  maturity: stable

access:
  has_free_access: false
