id: gemini-4-neon
name: Gemini 4 Neon
provider: Google
version: "4"
license: proprietary

# Model page: "Inputs Text, Image, Video, Audio, and PDF; Output Text";
# "Function calling Supported", "Structured outputs Supported",
# "Image generation Not supported", "Audio generation Not supported".
# json_mode on the same basis as the other Gemini entries.
# Source: https://ai.google.dev/gemini-api/docs/models/gemini-4-neon
# (checked 2026-11-19).
capabilities:
  vision: true
  audio: true
  image_generation: false
  tool_calling: true
  structured_output: true
  json_mode: true

# Editorial (bot's judgment, 2026-11-19); reasoning in Docs/models/gemini-4-neon.md.
quality:
  reasoning: very_high
  coding: very_high
  creative_writing: medium
  instruction_following: high

# Curated Gemini language set (Iteration #1).
languages: [en, es, pt, fr, de, ja, zh, hi, ar, ru]
language_quality:
  en: very_high
  es: high
  pt: high
  fr: high
  de: high
  ja: medium
  zh: medium
  hi: medium
  ar: medium
  ru: medium

# max_output is the default synchronous limit. The model page also documents
# "up to 1,048,576 (with long decode)" -- recorded in Docs/models/gemini-4-neon.md
# (Iteration #24/#26 convention).
operational:
  context_window: 1048576
  max_output: 65536

# Paid tier, no end date and no prompt-length split published: "$3.00" input,
# "$15.00" output per 1M tokens. Cached input is $0.15 (implicit only); the
# schema has no field for it (see the model doc and the route caveat).
# Source: https://ai.google.dev/gemini-api/docs/pricing (Paid Tier; checked
# 2026-11-19). Changelog of 2026-11-18 quotes the same rates.
cost:
  input_per_million: 3.00
  output_per_million: 15.00

# "Stable: gemini-4-neon" (model page).
ecosystem:
  integration_ease: high
  maturity: stable

# "Gemini 4 Neon is not available on the Free tier" (pricing page).
access:
  has_free_access: false

# Source: https://ai.google.dev/gemini-api/docs/deprecations (checked 2026-11-19):
# "gemini-4-neon | November 18, 2026 | No shutdown date announced".
# Release date: https://ai.google.dev/gemini-api/docs/changelog (November 18, 2026:
# "Gemini 4 Neon (gemini-4-neon) generally available (GA)").
lifecycle:
  status: active
  release_date: "2026-11-18"
  shutdown_date: null
  replacement: null
