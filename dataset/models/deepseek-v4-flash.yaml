id: deepseek-v4-flash
name: DeepSeek V4 Flash
provider: DeepSeek
version: "V4"
license: open-weights

capabilities:
  vision: false
  audio: false
  image_generation: false
  tool_calling: true
  structured_output: false
  json_mode: true

quality:
  reasoning: high
  coding: high
  creative_writing: medium
  instruction_following: medium

languages: [en, zh, es, fr, de, ja, ru]
language_quality:
  en: very_high
  zh: very_high
  es: medium
  fr: medium
  de: medium
  ja: medium
  ru: medium

operational:
  context_window: 1000000
  max_output: 384000

# Peak-hours rate (01:00-04:00 and 06:00-10:00 UTC, Mon-Fri) per
# DeepSeek's official pricing page — the stale $0.14/$0.28 previously
# here matched neither current tier. Off-peak (all other hours) is
# half this: $0.22/$0.66. Source: https://api-docs.deepseek.com/quick_start/pricing
cost:
  input_per_million: 0.44
  output_per_million: 1.32

ecosystem:
  integration_ease: medium
  maturity: stable

access:
  has_free_access: false
