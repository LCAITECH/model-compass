id: deepseek-v4-flash
name: DeepSeek V4.1 Flash
provider: DeepSeek
version: "V4.1"
license: open-weights

capabilities:
  vision: true
  audio: false
  image_generation: false
  tool_calling: true
  structured_output: false
  json_mode: true

quality:
  reasoning: high
  coding: high
  creative_writing: medium
  instruction_following: medium

languages: [en, zh, es, fr, de, ja, ru]
language_quality:
  en: very_high
  zh: very_high
  es: medium
  fr: medium
  de: medium
  ja: medium
  ru: medium

operational:
  context_window: 1000000
  max_output: 384000

# Peak cache-miss rate (01:00-04:00 and 06:00-10:00 UTC, Mon-Fri) per
# DeepSeek's official pricing page for deepseek-flash (V4.1-Flash; model
# version DeepSeek-V4.1-Flash-1017 since 2026-10-17, same prices).
# Off-peak is half: $0.15/$0.60. Legacy id deepseek-v4-flash still
# accepted; requests are served by V4.1-Flash-1017 at Flash prices.
# Source: https://api-docs.deepseek.com/quick_start/pricing (2026-10-05; re-checked 2026-10-17)
cost:
  input_per_million: 0.30
  output_per_million: 1.20

ecosystem:
  integration_ease: medium
  maturity: stable

access:
  has_free_access: false

# Source: https://api-docs.deepseek.com/quick_start/pricing (checked 2026-10-17).
# Served as DeepSeek-V4.1-Flash-1017 since 2026-10-17 ("DeepSeek V4.1 Flash has
# been upgraded to DeepSeek-V4.1-Flash-1017 ... The API calling method and pricing
# remain unchanged", https://api-docs.deepseek.com/updates); the deepseek-v4-flash
# name is still accepted.
# Release date: https://api-docs.deepseek.com/news/news260910/ (DeepSeek-V4.1-Flash Release),
# first API availability of V4.1 Flash; the 1017 update keeps the same model and id.
lifecycle:
  status: active
  release_date: "2026-09-10"
  shutdown_date: null
  replacement: null
