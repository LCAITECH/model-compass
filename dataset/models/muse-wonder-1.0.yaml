id: muse-wonder-1.0
name: Muse Wonder
provider: Meta
version: "1.0"
license: proprietary

# Preview model (https://dev.meta.ai/docs/models). See
# Docs/models/muse-wonder-1.0.md for sourcing and for which values are
# conservative placeholders forced by the all-fields-required schema
# (json_mode, languages/language_quality, max_output, has_free_access).
capabilities:
  vision: true
  audio: true
  image_generation: false
  tool_calling: true
  structured_output: true
  json_mode: false

quality:
  reasoning: high
  coding: high
  creative_writing: medium
  instruction_following: high

languages: [en]
language_quality:
  en: high

operational:
  context_window: 1048576
  max_output: 8192

# Standard mode, no long-context premium. Cached input $0.20/1M exists but
# is not representable in the schema.
# Source: https://dev.meta.ai/docs/pricing-rate-limits
cost:
  input_per_million: 4.00
  output_per_million: 20.00

ecosystem:
  integration_ease: medium
  maturity: experimental

access:
  has_free_access: false
