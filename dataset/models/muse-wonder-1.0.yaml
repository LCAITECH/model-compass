id: muse-wonder-1.0
name: Muse Wonder
provider: Meta
version: "1.0"
license: proprietary

# Models page: "Muse Wonder takes text, image, video, audio, and PDF input,
# returns text"; tool calling and structured output listed. json_mode: Meta
# documents JSON Schema structured output only (no separate JSON mode), the
# same basis as other entries that don't itemize it.
# Source: https://dev.meta.ai/docs/models (checked 2026-10-15).
capabilities:
  vision: true
  audio: true
  image_generation: false
  tool_calling: true
  structured_output: true
  json_mode: true

quality:
  reasoning: very_high
  coding: very_high
  creative_writing: medium
  instruction_following: high

# Meta publishes no supported-language list; curated (Iteration #33).
languages: [en, es, pt, fr, de, it]
language_quality:
  en: very_high
  es: high
  pt: high
  fr: high
  de: high
  it: high

# Context: "a 1,048,576-token context window". Meta publishes no output
# ceiling for this model (Iteration #26).
operational:
  context_window: 1048576
  max_output: null

# Standard mode; Contributor mode is not offered for Muse Wonder.
# Source: https://dev.meta.ai/docs/pricing-rate-limits (checked 2026-10-15).
cost:
  input_per_million: 4.00
  output_per_million: 20.00

# "Muse Wonder is in preview" (models page).
ecosystem:
  integration_ease: high
  maturity: experimental

access:
  has_free_access: false

# Source: https://dev.meta.ai/docs/models (checked 2026-10-15): in preview,
# no deprecation. Release date: https://dev.meta.ai/resources/blog/build-with-muse-wonder
# ("Today we're excited to launch Muse Wonder on Muse Code and Meta Model API", Oct 12, 2026).
lifecycle:
  status: active
  release_date: "2026-10-12"
  shutdown_date: null
  replacement: null
