id: gpt-6-1-terra
name: GPT-6.1 Terra
provider: OpenAI
version: "6.1"
license: proprietary

capabilities:
  vision: true
  audio: false
  image_generation: false
  tool_calling: true
  structured_output: true
  json_mode: true

quality:
  reasoning: high
  coding: high
  creative_writing: high
  instruction_following: high

languages: [en, es, pt, fr, de, ja, zh, hi, ar, ru]
language_quality:
  en: very_high
  es: high
  pt: high
  fr: high
  de: high
  ja: medium
  zh: medium
  hi: medium
  ar: medium
  ru: medium

operational:
  context_window: 1050000
  max_output: 128000

# Standard short-context Flagship pricing. Source (direct):
# https://developers.openai.com/api/docs/pricing and
# https://developers.openai.com/api/docs/models/gpt-6.1-terra
# Prompts over 272K input tokens: 2x input, 1.5x output (higher tier, not stored, Iteration #24).
cost:
  input_per_million: 1.00
  output_per_million: 5.00

ecosystem:
  integration_ease: high
  maturity: stable

# No free path: the model page lists only paid usage tiers (Build/Launch/Grow),
# and OpenAI's announcement names Plus, Pro, Enterprise and Edu in ChatGPT, not Free.
# Source: https://openai.com/index/introducing-gpt-6-1-terra (read 2026-10-27).
access:
  has_free_access: false

# Source: https://developers.openai.com/api/docs/deprecations (checked 2026-10-27).
# Not on the deprecations page.
# Release date: https://developers.openai.com/api/docs/changelog (Oct 26, 2026:
# "Released GPT-6.1 Terra").
lifecycle:
  status: active
  release_date: "2026-10-26"
  shutdown_date: null
  replacement: null
