id: gpt-6-luna
name: GPT-6 Luna
provider: OpenAI
version: "6"
license: proprietary

capabilities:
  vision: true
  audio: false
  image_generation: false
  tool_calling: true
  structured_output: true
  json_mode: true

quality:
  reasoning: medium
  coding: medium
  creative_writing: low
  instruction_following: medium

languages: [en, es, pt, fr, de, ja, zh, hi, ar, ru]
language_quality:
  en: very_high
  es: high
  pt: high
  fr: high
  de: high
  ja: medium
  zh: medium
  hi: medium
  ar: medium
  ru: medium

operational:
  context_window: 1050000
  max_output: 128000

# Standard short-context Flagship pricing. Source (direct):
# https://developers.openai.com/api/docs/pricing and
# https://developers.openai.com/api/docs/models/gpt-6-luna
cost:
  input_per_million: 0.10
  output_per_million: 0.50

ecosystem:
  integration_ease: high
  maturity: stable

# Free consumer plan, not the API (Iteration #32): ChatGPT's plan table lists
# GPT-6 Luna as available on Free. The API's Free tier is "Not supported" on the
# model page. Source: https://chatgpt.com/pricing (checked 2026-10-15).
access:
  has_free_access: true

# Source: https://developers.openai.com/api/docs/deprecations (checked 2026-10-14).
# Not on the deprecations page.
# Release date: https://developers.openai.com/api/docs/changelog (Sep 22, 2026: GPT-6 Sol and GPT-6 Luna).
lifecycle:
  status: active
  release_date: "2026-09-22"
  shutdown_date: null
  replacement: null
