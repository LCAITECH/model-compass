id: gemini-2.5-pro
name: Gemini 2.5 Pro
provider: Google
version: "2.5"
license: proprietary

capabilities:
  vision: true
  audio: true
  image_generation: false
  tool_calling: true
  structured_output: true
  json_mode: true

quality:
  reasoning: very_high
  coding: very_high
  creative_writing: high
  instruction_following: high

languages: [en, es, pt, fr, de, ja, zh, hi, ar, ru]
language_quality:
  en: very_high
  es: high
  pt: high
  fr: high
  de: high
  ja: medium
  zh: medium
  hi: medium
  ar: medium
  ru: medium

operational:
  context_window: 1048576
  max_output: 65536

# Standard tier, prompts <= 200k tokens. Google also charges $2.50/$15.00
# above 200k tokens -- see Docs/models/gemini-2.5-pro.md for the tiered
# pricing this schema can't represent directly.
cost:
  input_per_million: 1.25
  output_per_million: 10.00

ecosystem:
  integration_ease: high
  maturity: stable

access:
  has_free_access: false

# Source: https://aistudio.google.com/docs/deprecations (formerly
# ai.google.dev/gemini-api/docs/deprecations, which now redirects; checked 2026-11-03).
# Google release notes, November 2, 2026 (https://aistudio.google.com/docs/changelog):
# "gemini-2.5-pro is deprecated and is no longer available to select in Google
# AI Studio. Effective December 1, 2026, all API requests to gemini-2.5-pro will
# automatically route to gemini-3.8-flash and be billed at Gemini 3.8 Flash rates."
# Deprecations table: shutdown date "December 1, 2026"; recommended
# replacement "gemini-3.8-flash".
# Replacement: still null, the owner's pick under Iteration #29 (Google
# named no Pro successor then). Google now names gemini-3.8-flash: owner
# decision pending in the 2026-11-03 bot PR.
# Release date: https://aistudio.google.com/docs/deprecations (release date column).
lifecycle:
  status: deprecated
  release_date: "2025-06-17"
  shutdown_date: "2026-12-01"
  replacement: null
