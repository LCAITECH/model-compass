id: gemini-2.5-pro
name: Gemini 2.5 Pro
provider: Google
version: "2.5"
license: proprietary

capabilities:
  vision: true
  audio: true
  image_generation: false
  tool_calling: true
  structured_output: true
  json_mode: true

quality:
  reasoning: very_high
  coding: very_high
  creative_writing: high
  instruction_following: high

languages: [en, es, pt, fr, de, ja, zh, hi, ar, ru]
language_quality:
  en: very_high
  es: high
  pt: high
  fr: high
  de: high
  ja: medium
  zh: medium
  hi: medium
  ar: medium
  ru: medium

operational:
  context_window: 1048576
  max_output: 65536

# Standard tier, prompts <= 200k tokens. Google also charges $2.50/$15.00
# above 200k tokens -- see Docs/models/gemini-2.5-pro.md for the tiered
# pricing this schema can't represent directly.
cost:
  input_per_million: 1.25
  output_per_million: 10.00

ecosystem:
  integration_ease: high
  maturity: stable

access:
  has_free_access: false

# Source: https://ai.google.dev/gemini-api/docs/deprecations (checked 2026-10-14).
# "Not deprecated"; no shutdown date announced. Restricted since the same
# page limits the Gemini 2.5 models "to users who have actively used them in
# the past" and points new projects to Gemini 3.5 Flash-Lite or 3.8 Flash
# (IMPLEMENTATION_NOTES.md, Iteration #29; status added 2026-10-15).
# Replacement: null. Google's advice names only Flash and Flash-Lite
# models, none of them a Pro successor.
# Release date: https://ai.google.dev/gemini-api/docs/deprecations (release date column).
lifecycle:
  status: restricted
  release_date: "2025-06-17"
  shutdown_date: null
  replacement: null
