id: gemini-2.5-flash-lite
name: Gemini 2.5 Flash-Lite
provider: Google
version: "2.5"
license: proprietary

capabilities:
  vision: true
  audio: true
  image_generation: false
  tool_calling: true
  structured_output: true
  json_mode: true

quality:
  reasoning: medium
  coding: medium
  creative_writing: low
  instruction_following: medium

languages: [en, es, pt, fr, de, ja, zh, hi, ar, ru]
language_quality:
  en: very_high
  es: high
  pt: high
  fr: high
  de: high
  ja: medium
  zh: medium
  hi: medium
  ar: medium
  ru: medium

operational:
  context_window: 1048576
  max_output: 65536

cost:
  input_per_million: 0.10
  output_per_million: 0.40

ecosystem:
  integration_ease: high
  maturity: stable

access:
  has_free_access: true

# Source: https://ai.google.dev/gemini-api/docs/deprecations (checked 2026-10-14).
# "Not deprecated"; no shutdown date announced. Restricted since the same
# page limits the Gemini 2.5 models "to users who have actively used them in
# the past" and points new projects to Gemini 3.5 Flash-Lite or 3.8 Flash
# (IMPLEMENTATION_NOTES.md, Iteration #29; status added 2026-10-15).
# Replacement: the project owner's per-model pick from Google's general
# advice (Google names no successor per model).
# Release date: https://ai.google.dev/gemini-api/docs/deprecations (release date column).
lifecycle:
  status: restricted
  release_date: "2025-07-22"
  shutdown_date: null
  replacement: gemini-3.5-flash-lite
